<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART PRESENSI</title>

 <!-- Icon Website (Favicon Tab Browser) -->
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgIpJW9I9kygFde0tcluF66frz5cxRzG2O59ttSwz4mLYS9no7BCAYi6TzAPibwGbvssvgs_MDLoMfKQ0OnOjCeWh_uz4nRDRoGy1_wtZz7hZnlGrbHjbIy6V4JYq3jBKlb5k5Lm8e4u2Gu4ByBOZ66-RMTt55T6DK982YlgdF_eZHMfsooK6AA7Vwt13vu/s320/Logo.png">

    
    <style>
        /* Hilangkan semua jarak margin dasar */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scrollbar muncul di luar iframe */
            background-color: #f8fafc; /* Warna background sama dengan Tailwind bg-slate-50 aplikasi Anda */
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        /* Container untuk memanipulasi posisi iframe */
        .iframe-container {
            position: absolute;
            top: -3px; /* MENARIK IFRAME KE ATAS UNTUK MENYEMBUNYIKAN BANNER GOOGLE */
            left: 0;
            width: 100%;
            height: calc(100% + 3px); /* Mengembalikan sisa tinggi di bawah agar tidak terpotong */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== LAYAR LOADING ===== */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            box-sizing: border-box;
            background-color: #f8fafc;
            transition: opacity .5s ease, visibility .5s ease;
        }
        #loader.hide {
            opacity: 0;
            visibility: hidden;
        }
        #loader img {
            width: 88px;
            height: 88px;
            object-fit: contain;
            animation: pulse 1.8s ease-in-out infinite;
        }
        #loader h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: .5px;
            text-align: center;
        }
        #loader p {
            margin: 0;
            font-size: 13px;
            color: #64748b;
            text-align: center;
            min-height: 1.3em;
        }
        .bar {
            width: min(280px, 80vw);
            height: 8px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }
        .bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            border-radius: 999px;
            transition: width .25s ease-out;
        }
        #percent {
            font-size: 13px;
            font-weight: 600;
            color: #2563eb;
            font-variant-numeric: tabular-nums;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: .85; }
        }
        @media (prefers-reduced-motion: reduce) {
            #loader img { animation: none; }
            .bar-fill, #loader { transition: none; }
        }

        /* ===== LAYAR SCAN KAMERA (dijalankan di halaman ini, di luar Apps Script) ===== */
        #scanOverlay { position: fixed; inset: 0; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; background: rgba(15,23,42,.92); }
        #scanOverlay.show { display: flex; }
        #scanOverlay video { width: min(92vw, 420px); aspect-ratio: 1 / 1; object-fit: cover; border-radius: 14px; background: #000; }
        #scanOverlay p { margin: 0; color: #fff; font-size: 14px; font-weight: 600; text-align: center; }
        #scanOverlay button { padding: 10px 24px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700; background: #fff; color: #0f172a; }
        #selfieOverlay { position: fixed; inset: 0; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; background: rgba(15,23,42,.92); }
        #selfieOverlay.show { display: flex; }
        #selfieOverlay video { width: min(92vw, 420px); aspect-ratio: 3 / 4; max-height: 70vh; object-fit: cover; border-radius: 14px; background: #000; transform: scaleX(-1); }
        #selfieOverlay p { margin: 0; color: #fff; font-size: 14px; font-weight: 600; text-align: center; }
        #selfieOverlay .row { display: flex; gap: 10px; }
        #selfieOverlay button { padding: 12px 26px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700; background: #fff; color: #0f172a; }
        #selfieOverlay #selfieShot { background: #059669; color: #fff; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>

    <!-- Layar loading -->
    <div id="loader" role="status" aria-live="polite">
     <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgIpJW9I9kygFde0tcluF66frz5cxRzG2O59ttSwz4mLYS9no7BCAYi6TzAPibwGbvssvgs_MDLoMfKQ0OnOjCeWh_uz4nRDRoGy1_wtZz7hZnlGrbHjbIy6V4JYq3jBKlb5k5Lm8e4u2Gu4ByBOZ66-RMTt55T6DK982YlgdF_eZHMfsooK6AA7Vwt13vu/s320/Logo.png" alt="Logo Smart Presensi">   
        <h1>SMART PRESENSI</h1>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <span id="percent">0%</span>
        <p id="statusText">Menyiapkan aplikasi...</p>
    </div>

    <!-- Layar scan kamera untuk barcode presensi -->
    <div id="scanOverlay" role="dialog" aria-live="polite">
        <p>Arahkan kamera ke barcode</p>
        <video id="scanVideo" playsinline muted></video>
        <button id="scanCancel" type="button">Batal</button>
    </div>

    <!-- Layar selfie: hanya kamera langsung (tanpa pilihan galeri) -->
    <div id="selfieOverlay" role="dialog" aria-live="polite">
        <p>Posisikan wajah di dalam bingkai</p>
        <video id="selfieVideo" playsinline muted></video>
        <div class="row">
            <button id="selfieShot" type="button">Ambil Foto</button>
            <button id="selfieCancel" type="button">Batal</button>
        </div>
    </div>

    <div class="iframe-container">
        <!-- Ganti dengan link Google Apps Script Anda -->
        <!-- Izin untuk aplikasi di dalam iframe.
             PENTING: setiap izin HARUS diberi "*" (contoh: fullscreen *). Tanpa "*", izin hanya diberikan ke
             alamat script.google.com saja, padahal Apps Script memuat aplikasi Anda di iframe bersarang lagi
             (script.googleusercontent.com) sehingga izin tidak sampai ke aplikasi.
             - camera *            : kamera untuk selfie & scan barcode
             - geolocation *       : GPS presensi
             - fullscreen *        : layar penuh (layar role Barcode)
             - screen-wake-lock *  : layar tetap menyala
             - autoplay *          : video kamera scanner langsung berjalan
             - clipboard-write *   : salin teks dari aplikasi
             Jangan menambahkan atribut sandbox pada iframe ini, karena bisa memblokir kamera & GPS. -->
        <iframe
            id="appFrame"
            src="https://script.google.com/macros/s/AKfycbyG7hUzKSvnVtASlSI-s4Q8uWNm4PHATMVfAkeseJ6BytH6NP7-Lgwawyy0NYDg_Xqu/exec"
            allow="camera *; geolocation *; fullscreen *; screen-wake-lock *; autoplay *; clipboard-write *"
            allowfullscreen></iframe>
    </div>

    <script>
        (function () {
            var loader = document.getElementById('loader');
            var fill = document.getElementById('barFill');
            var percentEl = document.getElementById('percent');
            var statusEl = document.getElementById('statusText');
            var frame = document.getElementById('appFrame');

            var progress = 0;
            var done = false;

            function render() {
                var p = Math.floor(progress);
                fill.style.width = p + '%';
                percentEl.textContent = p + '%';
                if (p < 30) statusEl.textContent = 'Menyiapkan aplikasi...';
                else if (p < 70) statusEl.textContent = 'Menghubungkan ke server...';
                else if (p < 100) statusEl.textContent = 'Memuat data...';
                else statusEl.textContent = 'Selesai!';
            }

            // Progress simulasi: cepat di awal, melambat mendekati 90%
            // (iframe tidak menyediakan progress asli, jadi ini estimasi)
            var timer = setInterval(function () {
                if (done) return;
                var target = 90;
                progress += (target - progress) * 0.04 + 0.15;
                if (progress > target) progress = target;
                render();
            }, 120);

            function finish() {
                if (done) return;
                done = true;
                clearInterval(timer);
                progress = 100;
                render();
                setTimeout(function () {
                    loader.classList.add('hide');
                    setTimeout(function () { loader.remove(); }, 600);
                }, 350);
            }

            // Selesai saat iframe berhasil dimuat
            frame.addEventListener('load', finish);

            // Pengaman: jika load tidak terpicu, tutup loader setelah 20 detik
            setTimeout(finish, 20000);
        })();
    </script>

    <script>
        /* ===== JEMBATAN KAMERA & LAYAR PENUH =====
           Google Apps Script memblokir kamera di dalam aplikasinya. Karena itu aplikasi meminta halaman
           pembungkus ini membuka kamera, membaca QR, lalu mengirim hasilnya kembali lewat postMessage. */
        (function () {
            var overlay = document.getElementById('scanOverlay');
            var video = document.getElementById('scanVideo');
            var stream = null, timer = 0, busy = false, target = null, detector = null;

            function okOrigin(o) { return /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(o); }
            function reply(type, extra) {
                if (!target) return;
                var m = { type: type }; for (var k in (extra || {})) m[k] = extra[k];
                try { target.postMessage(m, '*'); } catch (e) {}
            }
            function stop() {
                clearTimeout(timer); busy = false;
                if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
                video.srcObject = null;
                overlay.classList.remove('show');
            }
            function errMsg(e) {
                var n = (e && e.name) || '';
                if (n === 'NotAllowedError' || n === 'SecurityError') return 'Izin kamera ditolak/diblokir. Izinkan kamera untuk situs ini (ikon gembok di bilah alamat), lalu coba lagi.';
                if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'Kamera tidak ditemukan di perangkat ini. Gunakan browser lain.';
                if (n === 'NotReadableError') return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera lalu coba lagi.';
                return 'Kamera tidak bisa dibuka' + (n ? ' (' + n + ')' : '') + '.';
            }
            function decode(canvas, ctx, w, h) {
                var viaJsQR = function () {
                    if (typeof jsQR === 'undefined') return Promise.resolve(null);
                    var r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
                    return Promise.resolve(r ? r.data : null);
                };
                if ('BarcodeDetector' in window) {
                    try {
                        detector = detector || new BarcodeDetector({ formats: ['qr_code'] });
                        return detector.detect(canvas).then(function (r) { return (r && r.length) ? r[0].rawValue : viaJsQR(); }, viaJsQR);
                    } catch (e) {}
                }
                return viaJsQR();
            }
            function startScan(src) {
                if (stream) return;
                target = src;
                var cam = function () {
                    return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
                        .catch(function (e) {
                            return (e && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError'))
                                ? navigator.mediaDevices.getUserMedia({ video: true, audio: false }) : Promise.reject(e);
                        });
                };
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    reply('SP_SCAN_ERROR', { message: 'Browser tidak mendukung kamera langsung. Gunakan browser lain.' });
                    return;
                }
                cam().then(function (s) {
                    stream = s; video.muted = true; video.srcObject = s;
                    overlay.classList.add('show');
                    var p = video.play(); if (p && p.catch) p.catch(function () {});
                    var c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
                    (function loop() {
                        if (!stream) return;
                        if (video.videoWidth && !busy) {
                            busy = true;
                            var k = Math.min(1, 960 / video.videoWidth), w = Math.round(video.videoWidth * k), h = Math.round(video.videoHeight * k);
                            c.width = w; c.height = h; ctx.drawImage(video, 0, 0, w, h);
                            decode(c, ctx, w, h).then(function (text) {
                                busy = false;
                                if (text && stream) { stop(); reply('SP_SCAN_RESULT', { text: text }); }
                            }, function () { busy = false; });
                        }
                        timer = setTimeout(loop, 150);
                    })();
                }).catch(function (e) { reply('SP_SCAN_ERROR', { message: errMsg(e) }); });
            }

            document.getElementById('scanCancel').addEventListener('click', function () { stop(); reply('SP_SCAN_CANCEL'); });

            window.addEventListener('message', function (e) {
                if (!okOrigin(e.origin) || !e.data || typeof e.data !== 'object') return;
                if (e.data.type === 'SP_SCAN_REQUEST') {
                    try { e.source.postMessage({ type: 'SP_SCAN_ACK' }, '*'); } catch (x) {}
                    startScan(e.source);
                } else if (e.data.type === 'SP_FULLSCREEN_REQUEST') {
                    var el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
                    if (rq && !document.fullscreenElement) { try { var p = rq.call(el); if (p && p.catch) p.catch(function () {}); } catch (x) {} }
                }
            });
        })();
    </script>
    <script>
        /* ===== SELFIE LANGSUNG DARI KAMERA (tanpa galeri) ===== */
        (function () {
            var overlay = document.getElementById('selfieOverlay');
            var video = document.getElementById('selfieVideo');
            var stream = null, target = null;
            function okOrigin(o) { return /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(o); }
            function reply(type, extra) {
                if (!target) return;
                var m = { type: type }; for (var k in (extra || {})) m[k] = extra[k];
                try { target.postMessage(m, '*'); } catch (e) {}
            }
            function stop() {
                if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
                video.srcObject = null;
                overlay.classList.remove('show');
            }
            function errMsg(e) {
                var n = (e && e.name) || '';
                if (n === 'NotAllowedError' || n === 'SecurityError') return 'Izin kamera ditolak/diblokir. Izinkan kamera untuk situs ini (ikon gembok di bilah alamat), lalu coba lagi.';
                if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'Kamera depan tidak ditemukan di perangkat ini.';
                if (n === 'NotReadableError') return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera lalu coba lagi.';
                return 'Kamera tidak bisa dibuka' + (n ? ' (' + n + ')' : '') + '.';
            }
            function start(src) {
                if (stream) return;
                target = src;
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    reply('SP_SELFIE_ERROR', { message: 'Browser tidak mendukung kamera langsung.' });
                    return;
                }
                navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' } }, audio: false })
                    .catch(function (e) {
                        return (e && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError'))
                            ? navigator.mediaDevices.getUserMedia({ video: true, audio: false }) : Promise.reject(e);
                    })
                    .then(function (s) {
                        stream = s; video.muted = true; video.srcObject = s;
                        overlay.classList.add('show');
                        var p = video.play(); if (p && p.catch) p.catch(function () {});
                    })
                    .catch(function (e) { reply('SP_SELFIE_ERROR', { message: errMsg(e) }); });
            }
            document.getElementById('selfieShot').addEventListener('click', function () {
                if (!stream || !video.videoWidth) return;
                var w = video.videoWidth, h = video.videoHeight, maxDim = 400;
                if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
                else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
                var c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').drawImage(video, 0, 0, w, h);
                var dataUrl = c.toDataURL('image/jpeg', 0.5);
                stop();
                reply('SP_SELFIE_RESULT', { dataUrl: dataUrl });
            });
            document.getElementById('selfieCancel').addEventListener('click', function () { stop(); reply('SP_SELFIE_CANCEL'); });
            window.addEventListener('message', function (e) {
                if (!okOrigin(e.origin) || !e.data || typeof e.data !== 'object') return;
                if (e.data.type === 'SP_SELFIE_REQUEST') {
                    try { e.source.postMessage({ type: 'SP_SELFIE_ACK' }, '*'); } catch (x) {}
                    start(e.source);
                }
            });
        })();
    </script>
</body>
</html>
